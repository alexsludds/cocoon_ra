name: Build APK
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.11.1" }
      - run: gradle :app:assembleDebug --no-daemon
      - run: cp app/build/outputs/apk/debug/app-debug.apk cocoon-ra-v1.0.${{ github.run_number }}.apk
      - name: Publish release v1.0.${{ github.run_number }}
        env: { GH_TOKEN: "${{ github.token }}", V: "v1.0.${{ github.run_number }}" }
        run: |
          gh release delete latest --yes --cleanup-tag || true   # remove the old fixed-name release
          gh release create "$V" "cocoon-ra-$V.apk" --target "$GITHUB_SHA" --title "$V" --notes "Built from ${GITHUB_SHA::7}" --latest
